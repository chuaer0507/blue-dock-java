apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bluedock-staging

resources:
  - namespace.yaml
  - ../../base

images:
  - name: registry.example.com/bluedock/bluedock-boot
    newTag: staging
  - name: registry.example.com/bluedock/bluedock-worker-notify
    newTag: staging
  - name: registry.example.com/bluedock/bluedock-worker-index
    newTag: staging

replicas:
  - name: bluedock-boot
    count: 1
  - name: bluedock-worker-notify
    count: 1
  - name: bluedock-worker-index
    count: 1
