apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluedock-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /healthz {
        proxy_pass http://upstream_balancer/actuator/health/liveness;
      }
      location = /readyz {
        proxy_pass http://upstream_balancer/actuator/health/readiness;
      }
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bluedock-boot
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: bluedock-boot
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: bluedock-boot
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: bluedock-boot
                port:
                  number: 8080
