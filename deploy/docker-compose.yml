# deploy/docker-compose.yml — 联调镜像栈（boot/Worker 打进镜像，改代码须 --build）
# 日常改代码请用开发依赖栈：deploy/docker-compose.dev.yml（见 docs/ops/deployment.md）
# 镜像 tag：读 deploy/.env.dev 的 BLUEDOCK_VERSION；镜像名写死为 bluedock-boot / bluedock-worker-*
#   bash deploy/scripts/sync-env-image-tag.sh
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.dev up -d --build
name: bluedock
services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_ROOT_PASSWORD: bluedock_root_dev
      MYSQL_DATABASE: bluedock
      MYSQL_USER: bluedock
      MYSQL_PASSWORD: bluedock_dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/bluedock.cnf:/etc/mysql/conf.d/bluedock.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.8
    command: redis-server --appendonly yes --requirepass bluedock_redis_dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bluedock_redis_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  bluedock-boot:
    image: bluedock-boot:${BLUEDOCK_VERSION:-v1.0.0}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.boot
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bluedock?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: bluedock
      SPRING_DATASOURCE_PASSWORD: bluedock_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: bluedock_redis_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BLUEDOCK_JWT_SECRET: dev-only-change-in-prod-use-32-chars-min!!
      BLUEDOCK_SEED_ENABLED: "true"
      BLUEDOCK_DEPLOY_ENV_FILE: /app/deploy/.env.dev
      BLUEDOCK_UPLOAD_DIR: /app/data/uploads
      BLUEDOCK_LICENSE_PATH: /app/data/secrets/license.json
      BLUEDOCK_VERSION: ${BLUEDOCK_VERSION:-v1.0.0}
      BLUEDOCK_SEARCH_ENGINE: ${BLUEDOCK_SEARCH_ENGINE:-docs}
      BLUEDOCK_SEARCH_OPENSEARCH_ENABLED: ${BLUEDOCK_SEARCH_OPENSEARCH_ENABLED:-false}
      BLUEDOCK_SEARCH_OPENSEARCH_URL: ${BLUEDOCK_SEARCH_OPENSEARCH_URL:-http://opensearch:9200}
      BLUEDOCK_SEARCH_OPENSEARCH_INDEX: ${BLUEDOCK_SEARCH_OPENSEARCH_INDEX:-bluedock-search}
      BLUEDOCK_OFFICE_ENABLED: ${BLUEDOCK_OFFICE_ENABLED:-false}
      BLUEDOCK_OFFICE_DOCUMENT_SERVER_URL: ${BLUEDOCK_OFFICE_DOCUMENT_SERVER_URL:-}
      BLUEDOCK_OFFICE_JWT_SECRET: ${BLUEDOCK_OFFICE_JWT_SECRET:-}
      BLUEDOCK_OFFICE_PUBLIC_BASE_URL: ${BLUEDOCK_OFFICE_PUBLIC_BASE_URL:-http://nginx}
      BLUEDOCK_OFFICE_ALLOW_DEV_TOKEN: ${BLUEDOCK_OFFICE_ALLOW_DEV_TOKEN:-true}
    volumes:
      - boot_data:/app/data
      # 超管 bootstrap 写入宿主机 deploy/.env.dev（#admin账号 / #admin密码）
      - ./:/app/deploy
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  bluedock-worker-notify:
    image: bluedock-worker-notify:${BLUEDOCK_VERSION:-v1.0.0}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.worker-notify
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bluedock?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: bluedock
      SPRING_DATASOURCE_PASSWORD: bluedock_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: bluedock_redis_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  bluedock-worker-index:
    image: bluedock-worker-index:${BLUEDOCK_VERSION:-v1.0.0}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.worker-index
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bluedock?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: bluedock
      SPRING_DATASOURCE_PASSWORD: bluedock_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: bluedock_redis_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BLUEDOCK_SEARCH_ENGINE: ${BLUEDOCK_SEARCH_ENGINE:-docs}
      BLUEDOCK_SEARCH_OPENSEARCH_ENABLED: ${BLUEDOCK_SEARCH_OPENSEARCH_ENABLED:-false}
      BLUEDOCK_SEARCH_OPENSEARCH_URL: ${BLUEDOCK_SEARCH_OPENSEARCH_URL:-http://opensearch:9200}
      BLUEDOCK_SEARCH_OPENSEARCH_INDEX: ${BLUEDOCK_SEARCH_OPENSEARCH_INDEX:-bluedock-search}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # 可选：--profile opensearch
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.dev --profile opensearch up -d
  #   并设 BLUEDOCK_SEARCH_OPENSEARCH_ENABLED=true BLUEDOCK_SEARCH_ENGINE=opensearch
  opensearch:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 可选：--profile onlyoffice
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.dev --profile onlyoffice up -d
  #   BLUEDOCK_OFFICE_ENABLED=true
  #   BLUEDOCK_OFFICE_DOCUMENT_SERVER_URL=http://localhost:18082
  #   BLUEDOCK_OFFICE_JWT_SECRET=bluedock_office_dev_secret
  #   BLUEDOCK_OFFICE_PUBLIC_BASE_URL=http://nginx
  onlyoffice:
    profiles: ["onlyoffice"]
    image: onlyoffice/documentserver:8.2.2
    ports:
      - "18082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${BLUEDOCK_OFFICE_JWT_SECRET:-bluedock_office_dev_secret}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  nginx:
    image: nginx:1.30.4
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      bluedock-boot:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  boot_data:
  opensearch_data:
  onlyoffice_data:
