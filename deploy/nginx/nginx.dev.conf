worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        # 宿主机 bluedock-boot 仅绑 127.0.0.1:8080；对外入口为本容器 :18080
        set $bluedock_boot "host.docker.internal:8080";
        client_max_body_size 512m;
        include /etc/nginx/snippets/bluedock-locations.conf;
    }
}
