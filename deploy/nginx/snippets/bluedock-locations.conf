# 反代 bluedock-boot（server 块设置 $bluedock_boot 后 include）
# 助手 SSE：须关闭缓冲，否则 append 事件会攒包
location /api/ai/invoke/stream/ {
    proxy_pass http://$bluedock_boot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    chunked_transfer_encoding on;
}

location /api/ {
    proxy_pass http://$bluedock_boot;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 应用注册路径为 /ws（无尾斜杠）；用前缀 /ws 同时覆盖 /ws 与 /ws/...
location /ws {
    proxy_pass http://$bluedock_boot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /healthz {
    proxy_pass http://$bluedock_boot/actuator/health/liveness;
    proxy_set_header Host $host;
    access_log off;
}

location = /readyz {
    proxy_pass http://$bluedock_boot/actuator/health/readiness;
    proxy_set_header Host $host;
    access_log off;
}
