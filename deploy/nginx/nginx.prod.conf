worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS：按请求解析 bluedock-boot，避免容器重建后 upstream IP 过期 → 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # :80 仅探针（prod-switch / LB）；其余跳转 HTTPS
    server {
        listen 80;

        set $bluedock_boot "bluedock-boot:8080";

        location = /healthz {
            proxy_pass http://$bluedock_boot/actuator/health/liveness;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://$bluedock_boot/actuator/health/readiness;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        set $bluedock_boot "bluedock-boot:8080";
        client_max_body_size 512m;
        include /etc/nginx/snippets/bluedock-locations.conf;
    }
}
